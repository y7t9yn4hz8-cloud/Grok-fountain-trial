<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:,"><title>Depths of Veyra – Floor 1 Courtyard Prototype</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }

    #message {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      color: #e8f4ff;
      background: rgba(0, 20, 40, 0.88);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 16px;
      opacity: 0;
      transition: opacity 0.35s;
      pointer-events: none;
      text-align: center;
      max-width: 90%;
      z-index: 30;
    }

    #controls {
      position: absolute;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 0 12px;
      z-index: 20;
    }

    .btn {
      background: rgba(25, 55, 95, 0.92);
      color: #d0e8ff;
      border: 2px solid rgba(120, 180, 255, 0.45);
      border-radius: 14px;
      padding: 16px 0;
      font-size: 18px;
      font-weight: 600;
      width: 76px;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .btn:active { background: rgba(45, 90, 150, 0.95); transform: scale(0.96); }
    .btn:disabled { opacity: 0.4; pointer-events: none; }

    #drinkBtn {
      width: 110px;
      background: rgba(30, 80, 60, 0.92);
      border-color: rgba(100, 200, 140, 0.5);
    }
  header{position:absolute;z-index:10;top:max(26px,env(safe-area-inset-top));left:32px;color:#eee9da;text-shadow:0 2px 12px #000;pointer-events:none}h1{font:normal 32px Georgia,serif;letter-spacing:.02em;margin:8px 0}.eyebrow{font-size:10px;letter-spacing:.22em;color:#c0c4b6}header p{font:14px Georgia,serif;color:#c3c6bc}#visitBtn{position:absolute;right:22px;top:max(25px,env(safe-area-inset-top));z-index:20;background:#202721bb;color:#dedccc;border:1px solid #777e6c;padding:12px;border-radius:5px}.btn{background:#1b221ee6;border:1px solid #8c968377;border-radius:6px;color:#ecebdc;width:64px;height:56px;padding:10px;font-size:20px;backdrop-filter:blur(10px)}.btn:active{background:#485347}#drinkBtn{background:#3e5144e8;border-color:#9fa38a99;font-size:15px}#message{top:130px;background:#1e2823ed;border:1px solid #777e6c;font-size:14px;border-radius:5px}#controls{gap:8px;bottom:max(22px,env(safe-area-inset-bottom))}@media(max-width:600px){header{left:18px;top:22px}h1{font-size:24px}.eyebrow{font-size:8px;letter-spacing:.1em}header p{font-size:12px}#visitBtn{right:12px;top:105px;padding:10px;font-size:12px}#message{top:155px;width:85%}}
  </style>
</head>
<body>
  <header><div class="eyebrow">DEPTHS OF VEYRA · COURTYARD TRIAL · FIX 1</div><h1>Fountain of Renewal</h1><p>The storm has passed. Rest a while.</p></header>
  <button id="visitBtn" title="Leave the dungeon and begin a fresh visit">New visit</button>
  <div id="message" role="status" aria-live="polite"></div>
  <div id="controls">
    <button class="btn" id="leftBtn" aria-label="Turn left">↶</button>
    <button class="btn" id="forwardBtn" aria-label="Step forward">↑</button>
    <button class="btn" id="rightBtn" aria-label="Turn right">↷</button>
    <button class="btn" id="drinkBtn">Drink</button>
  </div>

<script type="module" src="./app.js?v=iphone-assets-1"></script>
</body>
</html>
